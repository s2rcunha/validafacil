<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<title>ValidaFácil</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--g:#166534;--g2:#22c55e;--bg:#f4f7f5;--card:#fff;--txt:#17201b;--mut:#66736a;--bd:#dce5df;--red:#b91c1c;--org:#c2410c;--yel:#a16207}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--txt)}
header{background:#103a22;color:white;padding:16px 18px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between}
header b{font-size:20px}header small{display:block;color:#b9d3c1}.wrap{max-width:1100px;margin:auto;padding:18px 18px 90px}
nav{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.tab{white-space:nowrap;border:1px solid var(--bd);background:white;padding:10px 13px;border-radius:10px;font-weight:700;cursor:pointer}.tab.on{background:var(--g);color:white;border-color:var(--g)}
.card{background:white;border:1px solid var(--bd);border-radius:15px;padding:17px;margin-bottom:15px;box-shadow:0 2px 10px #00000008}.card h2,.card h3{margin:0 0 12px}.mut{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:white;border:1px solid var(--bd);border-radius:14px;padding:15px}.stat strong{font-size:26px;display:block}
button,.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer}
button:disabled,.btn:disabled{opacity:.65;cursor:not-allowed}
.btn-spinner{display:inline-block;width:15px;height:15px;margin-right:7px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;vertical-align:-2px;animation:btnspin .7s linear infinite}
@keyframes btnspin{to{transform:rotate(360deg)}}.primary{background:var(--g);color:white}.secondary{background:#eaf1ec;color:#23452f}.danger{background:#fee2e2;color:#991b1b}.warning{background:#ffedd5;color:#9a3412}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.field label{font-size:13px;font-weight:700}
input,select{border:1px solid #cbd7ce;border-radius:9px;padding:11px;background:white;width:100%;font:inherit}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.span2{grid-column:span 2}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #edf1ee;font-size:14px}th{font-size:11px;color:#6b766e;text-transform:uppercase}.scroll{overflow:auto}
.pill{display:inline-block;border-radius:99px;padding:5px 8px;font-size:11px;font-weight:800}.red{background:#fee2e2;color:var(--red)}.org{background:#ffedd5;color:var(--org)}.yel{background:#fef9c3;color:var(--yel)}.green{background:#dcfce7;color:#15803d}.gray{background:#edf1ee;color:#536158}
.hide{display:none!important}.modal{position:fixed;inset:0;background:#0008;z-index:100;display:grid;place-items:center;padding:15px}.dialog{background:white;width:min(620px,100%);max-height:92vh;overflow:auto;border-radius:16px;padding:19px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.lot{border:1px solid var(--bd);border-radius:12px;padding:13px;margin:10px 0}.lothead{display:flex;justify-content:space-between;gap:10px}.bigscan{padding:16px;font-size:17px;width:100%}
.toast{position:fixed;right:18px;bottom:18px;background:#17201b;color:white;padding:12px 15px;border-radius:10px;z-index:200;max-width:350px}
.catalogItem{padding:9px 0;border-bottom:1px solid #edf1ee;display:flex;align-items:center;justify-content:space-between;gap:10px}.catalogItemName{min-width:0;overflow-wrap:anywhere}.catalogDelete{flex:0 0 auto}.code{font-family:ui-monospace,Consolas,monospace}
/* Leitor de código de barras */
.scanDialog{width:min(760px,100%);background:#111;color:#fff;padding:14px}
.scanDialog h2{margin:2px 0 5px}.scanHint{color:#d1d5db;font-size:13px;margin:0 0 12px}
.cameraStage{position:relative;background:#000;border-radius:14px;overflow:hidden;min-height:280px;display:grid;place-items:center}
.cameraStage video{display:block;width:100%;max-height:68vh;object-fit:cover}
.scanFrame{position:absolute;left:8%;right:8%;top:50%;height:31%;transform:translateY(-50%);border:2px solid #4ade80;border-radius:14px;box-shadow:0 0 0 9999px #0004;pointer-events:none}
.scanFrame:before,.scanFrame:after{content:'';position:absolute;left:8%;right:8%;height:2px;background:#86efac;box-shadow:0 0 8px #22c55e}
.scanFrame:before{top:50%}.scanFrame:after{display:none}
.cameraControls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.cameraControls button{flex:1 1 130px}
.cameraControls .camOn{background:#fef3c7;color:#92400e}
.zoomControl{display:flex;align-items:center;gap:9px;flex:2 1 220px;background:#ffffff12;border-radius:10px;padding:8px 10px}
.zoomControl input{min-height:auto;padding:0}
.zoomControl span{white-space:nowrap;font-size:12px}
.camStatus{font-size:12px;color:#bbf7d0;margin-top:8px;min-height:18px}
@media(max-width:760px){
 .modal.cameraModal{padding:0}
 .scanDialog{width:100%;height:100%;max-height:none;border-radius:0;padding:12px;display:flex;flex-direction:column}
 .cameraStage{flex:1;min-height:0}
 .cameraStage video{height:100%;max-height:none}
 .scanFrame{left:6%;right:6%;height:24%}
 .cameraControls{margin-top:9px}
 .cameraControls button{min-height:46px}
}
/* Voltar ao topo */
.backTop{position:fixed;right:20px;bottom:22px;z-index:50;width:46px;height:46px;min-height:46px;padding:0;border-radius:50%;background:#166534;color:#fff;box-shadow:0 5px 18px #0003;display:flex;align-items:center;justify-content:center;font-size:22px;opacity:0;visibility:hidden;transform:translateY(12px);pointer-events:none;transition:opacity .2s,transform .2s,visibility .2s}
.backTop.show{opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto}
.backTop:hover{background:#14532d}
@media(max-width:760px){.backTop{right:13px;bottom:16px;width:48px;height:48px;min-height:48px;z-index:45}}
/* Layout com sidebar */
body{min-height:100vh}
header{margin-left:230px;transition:margin-left .25s ease}
.wrap{max-width:none;margin-left:230px;padding:20px 22px 90px;transition:margin-left .25s ease}
.sidebar{position:fixed;inset:0 auto 0 0;width:230px;background:#0d2f1b;color:white;z-index:60;padding:18px 12px;display:flex;flex-direction:column;box-shadow:3px 0 18px #0002}
.sidebarBrand{padding:5px 8px 18px;border-bottom:1px solid #ffffff18;margin-bottom:12px}
.sidebarBrand b{font-size:20px}.sidebarBrand small{display:block;color:#a9c8b3;margin-top:3px}
.sidebar nav{display:flex;flex-direction:column;gap:7px;overflow:visible;margin:0}
.sidebar .tab{width:100%;text-align:left;background:transparent;color:#dbe9df;border:0;padding:12px 13px;border-radius:10px;font-size:14px}
.sidebar .tab:hover{background:#ffffff10}.sidebar .tab.on{background:#1d6b3b;color:#fff}
.sidebarFoot{margin-top:auto;padding:12px 8px 2px;color:#8fb29a;font-size:11px}
.menuBtn{display:none;background:#ffffff16;color:white;border:1px solid #ffffff22;padding:9px 11px;font-size:18px}
.sidebarOverlay{display:none}
.mobileTitle{display:none}
@media(max-width:760px){
 header{margin-left:0;padding:11px 12px;gap:10px}
 header>div:first-of-type{display:none}
 .mobileTitle{display:block;flex:1;min-width:0;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .menuBtn{display:inline-flex;align-items:center;justify-content:center;min-width:42px;min-height:42px}
 header .syncBtn{padding:10px 11px;min-height:42px;font-size:0}
 header .syncBtn::after{content:'↻';font-size:20px}
 header .logoutBtn{padding:10px 12px;min-height:42px;font-size:13px;background:#ffffff16;color:#fff;border:1px solid #ffffff22}
 .wrap{margin-left:0;padding:12px 10px 80px}
 .sidebar{transform:translateX(-105%);transition:transform .25s ease;width:min(82vw,290px);box-shadow:5px 0 25px #0005}
 body.menuOpen .sidebar{transform:translateX(0)}
 .sidebarOverlay{display:block;position:fixed;inset:0;background:#0007;z-index:55;opacity:0;pointer-events:none;transition:opacity .25s}
 body.menuOpen .sidebarOverlay{opacity:1;pointer-events:auto}
 .grid{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:12px}.stat strong{font-size:23px}.stat span{font-size:12px}
 .formgrid{grid-template-columns:1fr}.span2{grid-column:auto}
 .card{padding:14px;border-radius:13px;margin-bottom:11px}
 .card h2{font-size:19px}.card h3{font-size:17px}
 button,.btn{min-height:44px;padding:11px 13px}
 .row>button{flex:1 1 auto}
 .bigscan{font-size:16px}
 input,select{min-height:46px;font-size:16px}
 .dialog{padding:15px;border-radius:14px;max-height:94vh}
 .actions{position:sticky;bottom:-15px;background:white;padding:10px 0 0;z-index:2}
 .actions button{flex:1}
 .scroll{margin-left:-4px;margin-right:-4px}
 table{min-width:620px}
 th,td{padding:9px 7px;font-size:13px}
 .lot{padding:12px}.lothead{align-items:flex-start;flex-direction:column}.lothead>button{width:100%}
 .catalogItem{padding:10px 0}.catalogDelete{min-height:38px;padding:8px 10px}
 .toast{left:10px;right:10px;bottom:12px;max-width:none;text-align:center}
 .desktopOnly{display:none}
}
@media(max-width:390px){.grid{grid-template-columns:1fr 1fr}.stat strong{font-size:21px}.wrap{padding-left:8px;padding-right:8px}}

/* Autenticação */
.authScreen{position:fixed;inset:0;z-index:500;background:linear-gradient(145deg,#0d2f1b,#166534);display:grid;place-items:center;padding:18px}
.authBox{width:min(430px,100%);background:#fff;border-radius:18px;padding:24px;box-shadow:0 20px 60px #0005}
.authBrand{text-align:center;margin-bottom:20px}.authBrand b{font-size:25px;color:#14532d}.authBrand small{display:block;color:var(--mut);margin-top:5px}
.authLinks{display:flex;justify-content:center;margin-top:14px}.linkBtn{background:transparent;color:#166534;padding:6px;text-decoration:underline}
.userBar{display:flex;align-items:center;gap:8px;color:#dbe9df;font-size:12px}.userBar b{font-size:13px;color:#fff}
.userItem{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #edf1ee}.userItem:last-child{border-bottom:0}
.userMeta{min-width:0}.userMeta b,.userMeta span{display:block}.userMeta span{font-size:12px;color:var(--mut);overflow-wrap:anywhere}
.roleBadge{display:inline-block!important;width:max-content;margin-top:4px;padding:3px 7px;border-radius:99px;background:#eaf1ec;color:#166534!important;font-size:10px!important;font-weight:800}
@media(max-width:760px){.authBox{padding:19px}.userBar .userText{display:none}.userItem{align-items:flex-start;flex-direction:column}.userItem .row{width:100%}.userItem .row button{flex:1}}

.productVisual{display:flex;gap:12px;align-items:flex-start}
.productImg{width:82px;height:82px;object-fit:contain;background:#f7faf8;border:1px solid var(--bd);border-radius:12px;flex:0 0 auto}
.productImgLarge{display:block;width:min(220px,60vw);height:180px;object-fit:contain;background:#f7faf8;border:1px solid var(--bd);border-radius:14px;margin:10px 0}
.catalogThumb{width:46px;height:46px;object-fit:contain;background:#f7faf8;border:1px solid var(--bd);border-radius:8px;flex:0 0 auto}
.catalogItemMain{display:flex;align-items:center;gap:10px;min-width:0}
.imagePreview{width:120px;height:120px;object-fit:contain;border:1px solid var(--bd);border-radius:12px;background:#f7faf8;margin-top:8px}
@media(max-width:480px){.productImg{width:68px;height:68px}.productVisual{gap:9px}}

.catalogPicker{border:1px solid var(--bd);border-radius:10px;background:#fff;max-height:300px;overflow:auto;margin-top:6px}
.catalogPickItem{width:100%;border:0;border-bottom:1px solid #edf1ee;border-radius:0;background:#fff;color:var(--txt);padding:9px;display:flex;align-items:center;gap:11px;text-align:left;min-height:62px}
.catalogPickItem:last-child{border-bottom:0}.catalogPickItem:hover,.catalogPickItem:focus{background:#f0f7f2}
.catalogPickItem img{width:52px;height:52px;object-fit:contain;border:1px solid var(--bd);border-radius:8px;background:#f7faf8;flex:0 0 auto}
.catalogPickNoImg{width:52px;height:52px;border:1px solid var(--bd);border-radius:8px;background:#f1f5f2;display:grid;place-items:center;color:#849188;font-size:22px;flex:0 0 auto}
.catalogPickName{font-weight:700;overflow-wrap:anywhere}
.catalogPickEmpty{padding:12px;color:var(--mut);font-size:13px}
</style>
</head>
<body>
<div id="authScreen" class="authScreen">
 <div class="authBox">
  <div class="authBrand"><b>✓ ValidaFácil</b><small>Controle de validades e alertas</small></div>
  <div id="authContent"></div>
 </div>
</div>
<aside class="sidebar" id="sidebar">
 <div class="sidebarBrand"><b>✓ ValidaFácil</b><small>Validades e alertas</small></div>
 <nav>
  <button class="tab on" data-p="painel">▦ &nbsp; Painel</button>
  <button class="tab" data-p="scanner">▣ &nbsp; Escanear</button>
  <button class="tab" data-p="produtos">▤ &nbsp; Produtos</button>
  <button class="tab" data-p="catalogo">≡ &nbsp; Catálogo</button>
  <button class="tab" data-p="config">⚙ &nbsp; Configurações</button>
  <button class="tab hide" id="usersTab" data-p="usuarios">♙ &nbsp; Usuários</button>
 </nav>
 <div class="sidebarFoot"><div id="sideUser"></div><div style="margin-top:6px">Controle de validade</div></div>
</aside>
<div class="sidebarOverlay" onclick="closeMenu()"></div>
<header>
 <button class="menuBtn" onclick="toggleMenu()" aria-label="Abrir menu">☰</button>
 <div><b>✓ ValidaFácil</b><small>Validades e alertas</small></div>
 <div class="mobileTitle" id="mobileTitle">Painel</div>
 <div class="userBar"><span class="userText" id="headerUser"></span><button class="secondary logoutBtn" onclick="logout()">Sair</button></div>
</header>
<div class="wrap">
<section id="painel"></section><section id="scanner" class="hide"></section><section id="produtos" class="hide"></section><section id="catalogo" class="hide"></section><section id="config" class="hide"></section><section id="usuarios" class="hide"></section>
</div>
<button id="backTop" class="backTop" onclick="scrollToTop()" aria-label="Voltar ao topo" title="Voltar ao topo">↑</button>
<div id="modal"></div>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxEj5V1cBeEUrIwolH8xswG8Cu8gDc6CEKk1wvLXb-GKzZbCw2Fr90wQZZ7oHkG1mXK/exec';
let DB={catalogo:[],catalogoImagens:{},produtos:[],lotes:[],config:{avisoPadraoDias:7}};
let AUTH={token:localStorage.getItem('validafacil_token')||'',user:null};
let AUTO_SYNC_BUSY=false,SAVE_BUSY=false,BASE_DB=null;
const $=id=>document.getElementById(id), todayISO=()=>new Date().toISOString().slice(0,10);
function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2800)}
function busy(btn,label='Carregando...'){if(!btn||btn.dataset.busy)return false;btn.dataset.busy='1';btn.dataset.old=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="btn-spinner"></span>'+label;return true}
function free(btn){if(!btn)return;btn.disabled=false;btn.innerHTML=btn.dataset.old||btn.innerHTML;delete btn.dataset.old;delete btn.dataset.busy}
async function withBusy(btn,label,fn){if(!busy(btn,label))return;try{return await fn()}finally{free(btn)}}
function quickBusy(btn,label='Processando...'){if(!busy(btn,label))return;setTimeout(()=>free(btn),180)}

async function api(func,payload={}){
 if(API_URL.includes('COLE_AQUI')) throw new Error('Configure a URL do Apps Script no index.html.');
 let body={func,payload};if(AUTH.token)body.token=AUTH.token;
 let r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
 let j=await r.json();if(!j.ok){if(j.code==='AUTH_REQUIRED'||j.code==='SESSION_EXPIRED')forceLogout();throw new Error(j.error||'Erro na API')}return j;
}
function modalOpen(){return !!$('modal')?.innerHTML.trim()}
function cloneDB(x){return JSON.parse(JSON.stringify(x))}
function acceptServerDB(data){
 DB=data;DB.catalogoImagens=DB.catalogoImagens||{};DB.revisao=Number(DB.revisao||0);
 BASE_DB=cloneDB(DB);
}
async function autoSync(){
 if(!AUTH.token||AUTO_SYNC_BUSY||SAVE_BUSY||document.hidden||modalOpen())return;
 AUTO_SYNC_BUSY=true;
 try{
  let r=await api('getDatabase');
  acceptServerDB(r.data);render();
 }catch(e){
  if(e.message!=='Faça login para continuar.'&&e.message!=='Sessão expirada. Entre novamente.')console.warn('Sincronização automática:',e);
 }finally{AUTO_SYNC_BUSY=false}
}
function startAutoSync(){/* sem temporizador: sincroniza apenas em momentos seguros */}
function stopAutoSync(){AUTO_SYNC_BUSY=false}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&AUTH.token)autoSync()});
window.addEventListener('focus',()=>{if(AUTH.token)autoSync()});

async function sync(btn){return withBusy(btn,'Sincronizando...',async()=>{try{let r=await api('getDatabase');acceptServerDB(r.data);render();toast('Dados sincronizados.')}catch(e){alert(e.message)}})}
async function saveDB(){
 if(SAVE_BUSY)return false;
 SAVE_BUSY=true;
 try{
  const base=BASE_DB||cloneDB(DB);
  const r=await api('saveDatabase',{baseRevision:Number(base.revisao||0),base:base,data:DB});
  acceptServerDB(r.data);
  render();toast('Salvo no Google Drive.');return true;
 }catch(e){
  alert(e.message);return false;
 }finally{SAVE_BUSY=false}
}
function prod(id){return DB.produtos.find(x=>x.id===id)}
function days(s){let a=new Date();a.setHours(0,0,0,0);return Math.round((new Date(s+'T00:00:00')-a)/86400000)}
function br(s){return new Date(s+'T00:00:00').toLocaleDateString('pt-BR')}
function stat(s){let d=days(s);return d<0?['Vencido','red']:d<=3?['Até 3 dias','org']:d<=7?['Até 7 dias','yel']:d<=15?['Até 15 dias','green']:['No prazo','gray']}
function pill(s){let a=stat(s);return `<span class="pill ${a[1]}">${a[0]}</span>`}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function normalizeName(s=''){
 return String(s)
  .normalize('NFD')
  .replace(/[\u0300-\u036f]/g,'')
  .replace(/\s+/g,' ')
  .trim()
  .toLocaleLowerCase('pt-BR');
}
function mergeCatalogNames(existing=[],incoming=[]){
 const map=new Map();
 [...existing,...incoming].forEach(raw=>{
  const name=String(raw||'').replace(/\s+/g,' ').trim();
  if(!name)return;
  const key=normalizeName(name);
  if(!map.has(key))map.set(key,name);
 });
 return [...map.values()].sort((a,b)=>a.localeCompare(b,'pt-BR',{sensitivity:'base'}));
}
function catalogHasName(name){
 const key=normalizeName(name);
 return DB.catalogo.some(n=>normalizeName(n)===key);
}
function render(){
 let ativos=DB.lotes.filter(l=>l.quantidade>0), venc=ativos.filter(l=>days(l.validade)<0), prox=ativos.filter(l=>days(l.validade)>=0&&days(l.validade)<=7);
 $('painel').innerHTML=`<div class="grid"><div class="stat"><strong>${DB.produtos.length}</strong><span>Produtos</span></div><div class="stat"><strong>${ativos.reduce((s,l)=>s+l.quantidade,0)}</strong><span>Unidades</span></div><div class="stat"><strong>${prox.length}</strong><span>Lotes até 7 dias</span></div><div class="stat"><strong>${venc.length}</strong><span>Lotes vencidos</span></div></div>
 <div class="card"><h2>Prioridades</h2>${lotsTable([...ativos].sort((a,b)=>a.validade.localeCompare(b.validade)).slice(0,20))}</div>`;
 $('scanner').innerHTML=`<div class="card"><h2>Escanear produto</h2><p class="mut">Use a câmera quando disponível ou digite o código de barras.</p><div class="field"><label>Código de barras</label><input id="scanInput" inputmode="numeric" enterkeyhint="search" autocomplete="off" placeholder="Leia ou digite o código" onkeydown="scanInputKey(event)"></div><div class="row"><button class="primary bigscan" onclick="lookupCode(this)">Consultar código</button><button class="secondary" onclick="cameraScan(this)">📷 Usar câmera</button></div><div id="scanResult"></div></div>`;
 $('produtos').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><div><h2>Produtos e lotes</h2><div class="mut">Cada código pode ter várias validades e avisos diferentes.</div></div></div>${productCards()}</div>`;
 $('catalogo').innerHTML=`<div class="card"><h2>Importar catálogo de nomes</h2><p class="mut">Selecione Excel (.xlsx/.xls) ou CSV. A 1ª linha é o cabeçalho, a 2ª é ignorada e a importação começa na 3ª linha. A imagem será lida da última coluna preenchida de cada linha.</p><input type="file" id="sheetFile" accept=".xlsx,.xls,.csv" onchange="readSheet(event)"><div id="importArea"></div></div>
 <div class="card"><h3>Catálogo importado (${DB.catalogo.length})</h3><input id="catSearch" placeholder="Pesquisar nome..." oninput="filterCatalog()"><div id="catList">${catalogList(DB.catalogo.slice(0,200))}</div></div>`;
 $('config').innerHTML=`<div class="card"><h2>Configurações</h2><div class="field"><label>Aviso padrão para novos lotes (dias antes)</label><input id="defaultDays" type="number" min="0" value="${DB.config?.avisoPadraoDias??7}"></div><button class="primary" onclick="saveConfig(this)">Salvar configuração</button></div>`;
 const isAdmin=AUTH.user?.perfil==='admin';
 $('usersTab')?.classList.toggle('hide',!isAdmin);
 if($('headerUser'))$('headerUser').textContent=AUTH.user?.nome||'';

  if(file){const up=await uploadProductImageFile(file,p.id,p.nome);p.imagemUrl=up.url;p.imagemArquivoId=up.fileId;p.imagemOrigem='drive'}

function previewChosenImage(input,id){const f=input.files?.[0],im=$(id);if(!f||!im)return;im.src=URL.createObjectURL(f);im.classList.remove('hide')}
function fileToCompressedData(file){
 return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{try{const max=1200,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale)),cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);resolve(cv.toDataURL('image/jpeg',.82))}catch(e){reject(e)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Não foi possível ler a imagem.'))};img.src=url})
}
async function uploadProductImageFile(file,produtoId,nome){if(!file.type.startsWith('image/'))throw new Error('Selecione um arquivo de imagem.');const dataUrl=await fileToCompressedData(file);const r=await api('uploadProductImage',{produtoId,nome,dataUrl});return r.image}

async function cameraScan(btn){
 if(!busy(btn,'Abrindo câmera...'))return;
 if(!navigator.mediaDevices?.getUserMedia){free(btn);return alert('A câmera não está disponível neste navegador. Use a versão HTTPS do sistema ou um leitor externo.');}
 if(!('BarcodeDetector' in window)){free(btn);return alert('A leitura automática de código de barras não é suportada neste navegador. Digite o código ou use um leitor Bluetooth/USB.');}
 try{
  const stream=await navigator.mediaDevices.getUserMedia({
   video:{
    facingMode:{ideal:'environment'},
    width:{ideal:1920},
    height:{ideal:1080}
   },
   audio:false
  });
  const track=stream.getVideoTracks()[0];
  const caps=track.getCapabilities?track.getCapabilities():{};
  const settings=track.getSettings?track.getSettings():{};
  window._stream=stream;window._camTrack=track;window._torchOn=false;

  // Tenta foco contínuo quando exposto pelo navegador/aparelho.
  try{
   if(Array.isArray(caps.focusMode)&&caps.focusMode.includes('continuous')){
    await track.applyConstraints({advanced:[{focusMode:'continuous'}]});
   }
  }catch(e){}

  const video=document.createElement('video');
  video.srcObject=stream;video.setAttribute('playsinline','');video.muted=true;
  await video.play();

  $('modal').innerHTML=`<div class="modal cameraModal"><div class="dialog scanDialog">
   <h2>Escanear código</h2>
   <p class="scanHint">Centralize o código dentro da moldura. Para códigos pequenos, aproxime o aparelho ou use o zoom.</p>
   <div class="cameraStage" id="videoBox"><div class="scanFrame"></div></div>
   <div class="cameraControls">
    <button id="torchBtn" class="secondary hide" onclick="toggleTorch(this)">🔦 Ligar lanterna</button>
    <div id="zoomBox" class="zoomControl hide">
     <span>🔍 Zoom</span>
     <input id="zoomRange" type="range" oninput="setCameraZoom(this.value)">
     <span id="zoomValue">1×</span>
    </div>
    <button class="secondary" onclick="stopCam()">Cancelar</button>
   </div>
   <div class="camStatus" id="camStatus"></div>
  </div></div>`;
  $('videoBox').prepend(video);

  // Exibe lanterna somente se suportada.
  if(caps.torch){
   $('torchBtn').classList.remove('hide');
  }

  // Exibe zoom somente se a câmera informar faixa de zoom.
  if(caps.zoom && Number.isFinite(caps.zoom.min) && Number.isFinite(caps.zoom.max) && caps.zoom.max>caps.zoom.min){
   const zr=$('zoomRange');
   zr.min=caps.zoom.min;zr.max=caps.zoom.max;zr.step=caps.zoom.step||0.1;
   zr.value=settings.zoom||caps.zoom.min;
   $('zoomValue').textContent=Number(zr.value).toFixed(1).replace('.0','')+'×';
   $('zoomBox').classList.remove('hide');
  }

  const focusOk=Array.isArray(caps.focusMode)&&caps.focusMode.includes('continuous');
  $('camStatus').textContent=focusOk?'Foco contínuo ativado.':'Foco automático controlado pelo aparelho.';
  free(btn);

  const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});
  let detecting=false;
  window._camTimer=setInterval(async()=>{
   if(detecting||video.readyState<2)return;
   detecting=true;
   try{
    const codes=await det.detect(video);
    if(codes[0]){
     const c=codes[0].rawValue;
     if(navigator.vibrate)navigator.vibrate(80);
     stopCam();go('scanner');
     setTimeout(()=>{$('scanInput').value=c;showCode(c)},50);
    }
   }catch(e){}finally{detecting=false}
  },300);
 }catch(e){
  free(btn);
  const insecure=location.protocol==='file:'||!window.isSecureContext;
  alert(insecure?'A câmera exige que o ValidaFácil seja aberto por HTTPS. O acesso direto pelo arquivo HTML pode bloquear a câmera.':'Não foi possível acessar a câmera: '+e.message);
 }
}
async function toggleTorch(btn){
 const track=window._camTrack;if(!track)return;
 try{
  const next=!window._torchOn;
  await track.applyConstraints({advanced:[{torch:next}]});
  window._torchOn=next;
  btn.textContent=next?'🔦 Desligar lanterna':'🔦 Ligar lanterna';
  btn.classList.toggle('camOn',next);
 }catch(e){alert('A lanterna não pôde ser controlada neste aparelho.')}
}
async function setCameraZoom(value){
 const track=window._camTrack;if(!track)return;
 const z=Number(value);
 try{
  await track.applyConstraints({advanced:[{zoom:z}]});
  if($('zoomValue'))$('zoomValue').textContent=z.toFixed(1).replace('.0','')+'×';
 }catch(e){}
}
function stopCam(){
 clearInterval(window._camTimer);
 window._camTimer=null;
 window._stream?.getTracks().forEach(t=>t.stop());
 window._stream=null;window._camTrack=null;window._torchOn=false;
 closeModal();
}

async function logout(){stopAutoSync();try{if(AUTH.token)await api('logout')}catch(e){}AUTH={token:'',user:null};localStorage.removeItem('validafacil_token');DB={catalogo:[],catalogoImagens:{},produtos:[],lotes:[],config:{avisoPadraoDias:7}};showAuthLogin()}
function showForgot(){$('authContent').innerHTML=`<h3>Redefinir senha</h3><p class="mut">Informe o e-mail cadastrado. Enviaremos um código de verificação válido por 15 minutos.</p><div class="field"><label>E-mail</label><input id="forgotEmail" type="email"></div><button class="primary bigscan" onclick="requestReset(this)">Enviar código</button><div class="authLinks"><button class="linkBtn" onclick="showAuthLogin()">Voltar ao login</button></div>`}
async function requestReset(btn){const email=$('forgotEmail').value.trim();if(!email)return alert('Informe o e-mail.');return withBusy(btn,'Enviando...',async()=>{try{await api('requestPasswordReset',{email});showReset(email)}catch(e){alert(e.message)}})}
function showReset(email){$('authContent').innerHTML=`<h3>Criar nova senha</h3><p class="mut">Digite o código enviado para <b>${esc(email)}</b>.</p><div class="field"><label>Código</label><input id="resetCode" inputmode="numeric" autocomplete="one-time-code"></div><div class="field"><label>Nova senha</label><input id="resetPass" type="password" minlength="6"></div><div class="field"><label>Confirmar nova senha</label><input id="resetPass2" type="password" minlength="6"></div><button class="primary bigscan" onclick="confirmReset('${esc(email)}',this)">Alterar senha</button><div class="authLinks"><button class="linkBtn" onclick="showAuthLogin()">Voltar ao login</button></div>`}
async function confirmReset(email,btn){const codigo=$('resetCode').value.trim(),senha=$('resetPass').value,senha2=$('resetPass2').value;if(senha!==senha2)return alert('As senhas não coincidem.');if(senha.length<6)return alert('A senha deve ter pelo menos 6 caracteres.');return withBusy(btn,'Alterando...',async()=>{try{await api('confirmPasswordReset',{email,codigo,novaSenha:senha});showAuthLogin('Senha alterada com sucesso.')}catch(e){alert(e.message)}})}
async function restoreSession(){if(!AUTH.token){showAuthLogin();return}try{const r=await api('session');AUTH.user=r.user;$('authScreen').classList.add('hide');await sync();startAutoSync()}catch(e){AUTH={token:'',user:null};localStorage.removeItem('validafacil_token');showAuthLogin()}}
async function loadUsers(){if(AUTH.user?.perfil!=='admin')return;try{const r=await api('listUsers');const box=$('usersList');if(!box)return;box.innerHTML=r.users.map(u=>`<div class="userItem"><div class="userMeta"><b>${esc(u.nome)}</b><span>${esc(u.email)}</span><span class="roleBadge">${u.perfil==='admin'?'Administrador':'Usuário'}${u.ativo?'':' • Inativo'}</span></div><div class="row">${u.id!==AUTH.user.id?`<button class="${u.ativo?'warning':'secondary'}" onclick="toggleUser('${u.id}',${!u.ativo},this)">${u.ativo?'Inativar':'Reativar'}</button>`:''}<button class="secondary" onclick="adminReset('${u.id}',this)">Enviar redefinição</button></div></div>`).join('')||'<p class="mut">Nenhum usuário.</p>'}catch(e){if($('usersList'))$('usersList').innerHTML=`<p class="mut">${esc(e.message)}</p>`}}
function openNewUser(){$('modal').innerHTML=`<div class="modal"><div class="dialog"><h2>Adicionar usuário</h2><div class="field"><label>Nome</label><input id="un"></div><div class="field"><label>E-mail</label><input id="ue" type="email"></div><div class="field"><label>Perfil</label><select id="up"><option value="user">Usuário</option><option value="admin">Administrador</option></select></div><p class="mut">O usuário receberá por e-mail um código para criar a própria senha.</p><div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="createUser(this)">Cadastrar</button></div></div></div>`}
async function createUser(btn){const nome=$('un').value.trim(),email=$('ue').value.trim(),perfil=$('up').value;if(!nome||!email)return alert('Informe nome e e-mail.');return withBusy(btn,'Cadastrando...',async()=>{try{await api('createUser',{nome,email,perfil});closeModal();await loadUsers();toast('Usuário cadastrado e convite enviado.')}catch(e){alert(e.message)}})}
async function toggleUser(id,ativo,btn){return withBusy(btn,ativo?'Reativando...':'Inativando...',async()=>{try{await api('setUserActive',{id,ativo});await loadUsers()}catch(e){alert(e.message)}})}
async function adminReset(id,btn){return withBusy(btn,'Enviando...',async()=>{try{await api('adminPasswordReset',{id});toast('Código de redefinição enviado.')}catch(e){alert(e.message)}})}

restoreSession();
</script>
</body>
</html>
