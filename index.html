<html lang="pt-BR">
<head>

<style>
:root{--g:#166534;--g2:#22c55e;--bg:#f4f7f5;--card:#fff;--txt:#17201b;--mut:#66736a;--bd:#dce5df;--red:#b91c1c;--org:#c2410c;--yel:#a16207}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--txt)}
header{background:#103a22;color:white;padding:16px 18px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between}
header b{font-size:20px}header small{display:block;color:#b9d3c1}.wrap{max-width:1100px;margin:auto;padding:18px 18px 90px}
nav{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.tab{white-space:nowrap;border:1px solid var(--bd);background:white;padding:10px 13px;border-radius:10px;font-weight:700;cursor:pointer}.tab.on{background:var(--g);color:white;border-color:var(--g)}
.card{background:white;border:1px solid var(--bd);border-radius:15px;padding:17px;margin-bottom:15px;box-shadow:0 2px 10px #00000008}.card h2,.card h3{margin:0 0 12px}.mut{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:white;border:1px solid var(--bd);border-radius:14px;padding:15px}.stat strong{font-size:26px;display:block}
button,.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer}
button:disabled,.btn:disabled{opacity:.65;cursor:not-allowed}
.btn-spinner{display:inline-block;width:15px;height:15px;margin-right:7px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;vertical-align:-2px;animation:btnspin .7s linear infinite}
@keyframes btnspin{to{transform:rotate(360deg)}}.primary{background:var(--g);color:white}.secondary{background:#eaf1ec;color:#23452f}.danger{background:#fee2e2;color:#991b1b}.warning{background:#ffedd5;color:#9a3412}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.field label{font-size:13px;font-weight:700}
input,select{border:1px solid #cbd7ce;border-radius:9px;padding:11px;background:white;width:100%;font:inherit}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.span2{grid-column:span 2}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #edf1ee;font-size:14px}th{font-size:11px;color:#6b766e;text-transform:uppercase}.scroll{overflow:auto}
.pill{display:inline-block;border-radius:99px;padding:5px 8px;font-size:11px;font-weight:800}.red{background:#fee2e2;color:var(--red)}.org{background:#ffedd5;color:var(--org)}.yel{background:#fef9c3;color:var(--yel)}.green{background:#dcfce7;color:#15803d}.gray{background:#edf1ee;color:#536158}
.hide{display:none!important}.modal{position:fixed;inset:0;background:#0008;z-index:100;display:grid;place-items:center;padding:15px}.dialog{background:white;width:min(620px,100%);max-height:92vh;overflow:auto;border-radius:16px;padding:19px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.lot{border:1px solid var(--bd);border-radius:12px;padding:13px;margin:10px 0}.lothead{display:flex;justify-content:space-between;gap:10px}.bigscan{padding:16px;font-size:17px;width:100%}
.toast{position:fixed;right:18px;bottom:18px;background:#17201b;color:white;padding:12px 15px;border-radius:10px;z-index:200;max-width:350px}
.catalogItem{padding:9px 0;border-bottom:1px solid #edf1ee;display:flex;align-items:center;justify-content:space-between;gap:10px}.catalogItemName{min-width:0;overflow-wrap:anywhere}.catalogDelete{flex:0 0 auto}.code{font-family:ui-monospace,Consolas,monospace}
/* Leitor de código de barras */

.scanDialog h2{margin:2px 0 5px}.scanHint{color:#d1d5db;font-size:13px;margin:0 0 12px}

.scanFrame:before,.scanFrame:after{content:'';position:absolute;left:8%;right:8%;height:2px;background:#86efac;box-shadow:0 0 8px #22c55e}

 .grid{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:12px}.stat strong{font-size:23px}.stat span{font-size:12px}
 .formgrid{grid-template-columns:1fr}.span2{grid-column:auto}

 button,.btn{min-height:44px;padding:11px 13px}
 .row>button{flex:1 1 auto}

 input,select{min-height:46px;font-size:16px}
 .dialog{padding:15px;border-radius:14px;max-height:94vh}

.productVisual{display:flex;gap:12px;align-items:flex-start}

.imagePreview{width:120px;height:120px;object-fit:contain;border:1px solid var(--bd);border-radius:12px;background:#f7faf8;margin-top:8px}

.catalogPicker{border:1px solid var(--bd);border-radius:10px;background:#fff;max-height:300px;overflow:auto;margin-top:6px}
.catalogPickItem{width:100%;border:0;border-bottom:1px solid #edf1ee;border-radius:0;background:#fff;color:var(--txt);padding:9px;display:flex;align-items:center;gap:11px;text-align:left;min-height:62px}
.catalogPickItem:last-child{border-bottom:0}.catalogPickItem:hover,.catalogPickItem:focus{background:#f0f7f2}
.catalogPickItem img{width:52px;height:52px;object-fit:contain;border:1px solid var(--bd);border-radius:8px;background:#f7faf8;flex:0 0 auto}
.catalogPickNoImg{width:52px;height:52px;border:1px solid var(--bd);border-radius:8px;background:#f1f5f2;display:grid;place-items:center;color:#849188;font-size:22px;flex:0 0 auto}
.catalogPickName{font-weight:700;overflow-wrap:anywhere}

.appLoading{position:fixed;inset:0;z-index:99999;background:rgba(247,250,248,.96);display:flex;align-items:center;justify-content:center;padding:24px}
.appLoading.hide{display:none}
.appLoadingTitle{font-weight:800;font-size:18px;margin-bottom:5px}.appLoadingText{color:var(--mut);font-size:14px}
@keyframes appSpin{to{transform:rotate(360deg)}}

/* UX e desempenho */
.stat.statAction{cursor:pointer;text-align:left;transition:transform .15s,box-shadow .15s;border:1px solid transparent}
.stat.statAction:hover{transform:translateY(-1px);box-shadow:0 5px 16px #00000012}
.stat.statAction.activeFilter{border-color:#166534;box-shadow:0 0 0 2px #16653418}
.productSearchBar{display:flex;gap:8px;align-items:center;margin:12px 0}
.productSearchBar input{flex:1}

.saveState.saving{opacity:.85}.saveState.saved{color:#bbf7d0}.saveState.error{color:#fecaca}
.scanOk{display:flex;align-items:center;gap:8px;background:#dcfce7;color:#166534;border-radius:10px;padding:9px 11px;margin:10px 0;font-weight:700}

/* Etapa 5 — UX e acessibilidade */
.dialog:focus{outline:2px solid rgba(37,99,235,.35);outline-offset:2px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(37,99,235,.28);outline-offset:2px}
button:disabled{opacity:.55;cursor:not-allowed}
.moreHint{margin-top:12px;padding:11px;border-radius:10px;background:rgba(127,127,127,.08);text-align:center}
.toast[role="status"]{max-width:min(92vw,420px)}

.toast{opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s ease,transform .2s ease}

<body>
</div>
<div id="authScreen" class="authScreen">
 <div class="authBox">
  <div class="authBrand"><b>✓ ValidaFácil</b><small>Controle de validades e alertas</small></div>
  <div id="authContent"></div>
 </div>
</div>
<aside class="sidebar" id="sidebar">
 <div class="sidebarBrand"><b>✓ ValidaFácil</b><small>Validades e alertas</small></div>
 <nav>
  <button class="tab on" data-p="painel">▦ &nbsp; Painel</button>
  <button class="tab" data-p="scanner">▣ &nbsp; Escanear</button>
  <button class="tab" data-p="produtos">▤ &nbsp; Produtos</button>

  <button class="tab" data-p="config">⚙ &nbsp; Configurações</button>
  <button class="tab hide" id="auditTab" data-p="auditoria">☷ &nbsp; Auditoria</button>
  <button class="tab hide" id="usersTab" data-p="usuarios">♙ &nbsp; Usuários</button>
 </nav>
 <div class="sidebarFoot"><div id="sideUser"></div><div style="margin-top:6px">Controle de validade</div></div>
</aside>
<div class="sidebarOverlay" onclick="closeMenu()"></div>
<header>
 <button class="menuBtn" onclick="toggleMenu()" aria-label="Abrir menu">☰</button>
 <div><b>✓ ValidaFácil</b><small>Validades e alertas</small></div>
 <div class="mobileTitle" id="mobileTitle">Painel</div>
 <div class="userBar"><span id="saveState" class="saveState"></span><button id="manualSyncBtn" class="secondary syncManual" onclick="manualSync(this)" title="Buscar dados mais recentes">Sincronizar</button><span class="userText" id="headerUser"></span><button class="secondary logoutBtn" onclick="logout(this)">Sair</button></div>
</header>
<div class="wrap">
<section id="painel"></section><section id="scanner" class="hide"></section><section id="produtos" class="hide"></section><section id="catalogo" class="hide"></section><section id="config" class="hide"></section><section id="auditoria" class="hide"></section><section id="usuarios" class="hide"></section>
</div>
<button id="backTop" class="backTop" onclick="scrollToTop()" aria-label="Voltar ao topo" title="Voltar ao topo">↑</button>
<div id="modal"></div>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxEj5V1cBeEUrIwolH8xswG8Cu8gDc6CEKk1wvLXb-GKzZbCw2Fr90wQZZ7oHkG1mXK/exec';
let DB={catalogo:[],catalogoImagens:{},produtos:[],lotes:[],config:{avisoPadraoDias:7}};
let AUTH={token:localStorage.getItem('validafacil_token')||'',user:null};
let AUTO_SYNC_BUSY=false,SAVE_BUSY=false,BASE_DB=null,SAVE_CURRENT=null,SAVE_PENDING=false,SAVE_CHAIN=Promise.resolve(true),SAVE_QUEUE_COUNT=0;
let ACTIVE_PAGE=localStorage.getItem('validafacil_last_page')||'painel';
let PANEL_LIMIT=30;
let PANEL_FILTER='todos',PRODUCT_SEARCH='',CURRENT_SCAN_CODE='';
let PRODUCT_BY_ID=new Map(),LOTS_BY_PRODUCT=new Map();
const $=id=>document.getElementById(id), todayISO=()=>new Date().toISOString().slice(0,10);
function modalOpen(){return !!$('modal')?.innerHTML.trim()}
function cloneDB(x){return JSON.parse(JSON.stringify(x))}
function ensureDB(){
 if(!DB||typeof DB!=='object')DB={catalogo:[],catalogoImagens:{},produtos:[],lotes:[],config:{avisoPadraoDias:7},revisao:0};
 if(!Array.isArray(DB.catalogo))DB.catalogo=[];
 if(!DB.catalogoImagens||typeof DB.catalogoImagens!=='object')DB.catalogoImagens={};
 if(!Array.isArray(DB.produtos))DB.produtos=[];
 if(!Array.isArray(DB.lotes))DB.lotes=[];
 if(!DB.config||typeof DB.config!=='object')DB.config={avisoPadraoDias:7};
 DB.revisao=Number(DB.revisao||0);
 return DB;
}

let XLSX_LOADING=null;
function ensureXLSX(){
 if(window.XLSX)return Promise.resolve(window.XLSX);
 if(XLSX_LOADING)return XLSX_LOADING;
 XLSX_LOADING=new Promise((resolve,reject)=>{
  const s=document.createElement('script');
  s.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
  s.async=true;
  s.onload=()=>window.XLSX?resolve(window.XLSX):reject(new Error('Biblioteca XLSX não ficou disponível.'));
  s.onerror=()=>reject(new Error('Não foi possível carregar o leitor de Excel. Verifique sua conexão.'));
  document.head.appendChild(s);
 });
 return XLSX_LOADING.finally(()=>{if(!window.XLSX)XLSX_LOADING=null});
}
function debounce(fn,wait=250){let timer;return function(...args){clearTimeout(timer);timer=setTimeout(()=>fn.apply(this,args),wait)}}
function newId(){
 if(window.crypto&&typeof crypto.randomUUID==='function')return crypto.randomUUID();
 if(window.crypto&&crypto.getRandomValues){
  const a=new Uint8Array(16);crypto.getRandomValues(a);a[6]=(a[6]&15)|64;a[8]=(a[8]&63)|128;
  const x=[...a].map(b=>b.toString(16).padStart(2,'0')).join('');
  return `${x.slice(0,8)}-${x.slice(8,12)}-${x.slice(12,16)}-${x.slice(16,20)}-${x.slice(20)}`;
 }
 return 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2);
}

function normalizeBarcode(v=''){
 let s=String(v??'').trim().replace(/\s+/g,'');
 // Cadastro operacional: GTIN/UPC/EAN numérico de 6 a 14 dígitos.
 if(!/^\d{6,14}$/.test(s))return '';
 // Normaliza UPC-A para a representação EAN-13 equivalente.
 if(s.length===12)s='0'+s;
 return s;
}
function requireBarcode(v){
 const c=normalizeBarcode(v);
 if(!c)throw new Error('Código de barras inválido. Use somente 6 a 14 dígitos.');
 return c;
}
function jsArg(v){return JSON.stringify(String(v??'')).replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/&/g,'\\u0026')}
function rebuildIndexes(){
 PRODUCT_BY_ID=new Map();
 LOTS_BY_PRODUCT=new Map();
 (DB.produtos||[]).forEach(p=>PRODUCT_BY_ID.set(p.id,p));
 (DB.lotes||[]).forEach(l=>{
  if(!LOTS_BY_PRODUCT.has(l.produtoId))LOTS_BY_PRODUCT.set(l.produtoId,[]);
  LOTS_BY_PRODUCT.get(l.produtoId).push(l);
 });
 LOTS_BY_PRODUCT.forEach(a=>a.sort((x,y)=>String(x.validade||'').localeCompare(String(y.validade||''))));
}


function busy(btn,label='Carregando...'){
 if(!btn||btn.dataset.busy)return false;
 btn.dataset.busy='1';btn.dataset.old=btn.innerHTML;
 btn.disabled=true;btn.innerHTML='<span class="btn-spinner"></span>'+label;
 return true;
}
function free(btn){
 if(!btn)return;
 btn.disabled=false;btn.innerHTML=btn.dataset.old||btn.innerHTML;
 delete btn.dataset.old;delete btn.dataset.busy;
}
async function withBusy(btn,label,fn){
 if(!busy(btn,label))return;
 try{return await fn()}catch(e){alert(e?.message||String(e));return false}finally{free(btn)}
}
function quickBusy(btn,label='Processando...'){
 if(!busy(btn,label))return;
 setTimeout(()=>free(btn),180);
}

async function api(func,payload={}){
 const body={func,payload};
 if(AUTH.token)body.token=AUTH.token;
 let response;
 try{
  response=await fetch(API_URL,{
   method:'POST',
   headers:{'Content-Type':'text/plain;charset=utf-8'},
   body:JSON.stringify(body)
  });
 }catch(e){
  throw new Error(`Falha de conexão com o servidor durante "${func}". Verifique sua internet e tente novamente.`);
 }
 const raw=(await response.text()).trim();
 if(!response.ok)throw new Error(`Falha do servidor durante "${func}" (HTTP ${response.status}).`);
 if(!raw||raw.startsWith('<'))throw new Error(`Resposta inválida durante "${func}". Verifique se a URL termina em /exec e se a implantação está atualizada.`);
 let j;
 try{j=JSON.parse(raw)}catch(e){throw new Error(`Resposta inválida do servidor durante "${func}".`)}
 if(!j.ok){
  if(j.code==='AUTH_REQUIRED'||j.code==='SESSION_EXPIRED')forceLogout();
  throw new Error(j.error||`Erro na API durante "${func}".`);
 }
 return j;
}


function toast(message){
 let el=$('toast');
 if(!el){
  el=document.createElement('div');
  el.id='toast';el.className='toast';
  el.setAttribute('role','status');
  el.setAttribute('aria-live','polite');
  el.setAttribute('aria-atomic','true');
  document.body.appendChild(el);
 }
 el.textContent=String(message||'');
 el.classList.add('show');
 clearTimeout(toast._timer);
 toast._timer=setTimeout(()=>el.classList.remove('show'),2600);
}

async function saveDB(){
 ensureDB();
 // Cada chamada captura o estado solicitado naquele instante.
 const requestedData=cloneDB(DB);
 const requestedBase=cloneDB(BASE_DB||DB);
 SAVE_QUEUE_COUNT++;
 const run=()=>saveDBCore(requestedBase,requestedData);
 const result=SAVE_CHAIN.then(run,run);
 SAVE_CHAIN=result.then(()=>true,()=>true);
 try{return await result}
 finally{SAVE_QUEUE_COUNT=Math.max(0,SAVE_QUEUE_COUNT-1)}
}
async function saveDBCore(base,data){
 SAVE_BUSY=true;
 setSaveState('Salvando…','saving');
 try{
  const r=await api('saveDatabase',{
   baseRevision:Number(base.revisao||0),
   base:base,
   data:data
  });
  // Se existe outro save aguardando, não substitui a UI pelo estado intermediário.
  // BASE_DB, porém, avança para a resposta confirmada do servidor.
  if(SAVE_QUEUE_COUNT>1){
   BASE_DB=cloneDB(r.data);
  }else{
   acceptServerDB(r.data);
   render();
  }
  setSaveState(SAVE_QUEUE_COUNT>1?'Salvando alterações pendentes…':'Salvo ✓',SAVE_QUEUE_COUNT>1?'saving':'saved');
  if(SAVE_QUEUE_COUNT<=1)setTimeout(()=>{if($('saveState')?.textContent==='Salvo ✓')setSaveState('')},2200);
  if(SAVE_QUEUE_COUNT<=1)toast('Salvo no Google Drive.');
  return true;
 }catch(e){
  setSaveState('Erro ao salvar','error');
  alert('Erro ao salvar: '+(e?.message||String(e)));
  return false;
 }finally{
  SAVE_BUSY=false;
  SAVE_CURRENT=null;
  SAVE_PENDING=false;
 }
}
function prod(id){return PRODUCT_BY_ID.get(id)||DB.produtos.find(x=>x.id===id)}
function days(s){let a=new Date();a.setHours(0,0,0,0);return Math.round((new Date(s+'T00:00:00')-a)/86400000)}
function br(s){return new Date(s+'T00:00:00').toLocaleDateString('pt-BR')}
function stat(s){let d=days(s);return d<0?['Vencido','red']:d<=3?['Até 3 dias','org']:d<=7?['Até 7 dias','yel']:d<=15?['Até 15 dias','green']:['No prazo','gray']}
function pill(s){let a=stat(s);return `<span class="pill ${a[1]}">${a[0]}</span>`}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function normalizeName(s=''){
 return String(s)
  .normalize('NFD')
  .replace(/[\u0300-\u036f]/g,'')
  .replace(/\s+/g,' ')
  .trim()
  .toLocaleLowerCase('pt-BR');
}
function upperProductName(s){return String(s||'').replace(/\s+/g,' ').trim().toLocaleUpperCase('pt-BR')}
function mergeCatalogNames(base,add){
 const map=new Map();
 [...(base||[]),...(add||[])].forEach(n=>{const v=upperProductName(n);if(v&&!map.has(normalizeName(v)))map.set(normalizeName(v),v)});
 return [...map.values()].sort((a,b)=>a.localeCompare(b,'pt-BR',{sensitivity:'base'}));
}
function catalogHasName(name){
 const key=normalizeName(name);
 return DB.catalogo.some(n=>normalizeName(n)===key);
}

async function deleteZeroLot(id,btn){

 const p=prod(l.produtoId);
 if(!confirm(`Excluir este lote zerado de "${p?.nome||'produto'}"?\n\nSomente este lote será removido. O produto e os demais lotes permanecerão cadastrados.`))return;
 return withBusy(btn,'Excluindo...',async()=>{
  const oldLotes=cloneDB(DB.lotes);
  DB.lotes=DB.lotes.filter(x=>x.id!==id);
  const ok=await saveDB();
  if(ok===false){DB.lotes=oldLotes;rebuildIndexes();render();return}
  render();toast('Lote zerado excluído.');
 })
}

async function readSheet(ev){
 let f=ev.target.files[0];if(!f)return;
 await ensureXLSX();
 const buf=await f.arrayBuffer(),wb=XLSX.read(buf),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
 if(!rows.length)return alert('Planilha vazia.');let headers=rows[0].map((x,i)=>String(x||`Coluna ${i+1}`));
 window._sheetRows=rows;
 $('importArea').innerHTML=`<div class="field" style="margin-top:12px"><label>Coluna com o nome dos produtos</label><select id="nameColumn">${headers.map((h,i)=>`<option value="${i}">${esc(h)}</option>`).join('')}</select></div><p class="mut">A linha 2 será ignorada. A imagem de cada produto será obtida da última célula preenchida da respectiva linha (ex.: coluna AB).</p><button class="primary" onclick="importNames(this)">Importar nomes e imagens</button>`;
}
async function importNames(btn){
 return withBusy(btn,'Importando...',async()=>{
  try{
   ensureDB();
   if(!window._sheetRows||!Array.isArray(window._sheetRows))throw new Error('Selecione a planilha novamente.');
   const sel=$('nameColumn');if(!sel)throw new Error('Selecione a coluna com o nome dos produtos.');
   let i=+sel.value,rows=window._sheetRows.slice(2),names=[],imgs={};
   rows.forEach(r=>{
    const nome=upperProductName(r[i]);if(!nome)return;
    names.push(nome);
    let last='';
    for(let c=r.length-1;c>=0;c--){if(String(r[c]??'').trim()){last=String(r[c]).trim();break}}
    if(/^https?:\/\//i.test(last))imgs[normalizeName(nome)]=last;
   });
   if(!names.length)throw new Error('Nenhum nome de produto foi encontrado a partir da 3ª linha.');
   DB.catalogo=mergeCatalogNames(DB.catalogo,names);
   Object.assign(DB.catalogoImagens,imgs);
   DB.produtos.forEach(p=>{const u=imgs[normalizeName(p.nome)];if(u&&!p.imagemArquivoId){p.imagemUrl=u;p.imagemOrigem='catalogo'}});
   const ok=await saveDB();
   if(ok!==false){render();toast(`${names.length} linha(s) processada(s).`)}
  }catch(e){
   console.error('Erro ao importar catálogo:',e);
   alert('Não foi possível importar o catálogo: '+(e?.message||e));
  }
 })
}

async function saveNewProduct(code,btn){

 if(!nome)return alert('Informe o nome.');

 return withBusy(btn,'Salvando...',async()=>{

   let existente=DB.catalogo.find(n=>normalizeName(n)===normalizeName(nome));

   if(catImg){

   DB.produtos.push(p);
   rebuildIndexes();

   const ok=await saveDB();
   if(!ok){

    ensureDB();
    rebuildIndexes();
    render();

   }

 return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{try{const max=1200,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale)),cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);resolve(cv.toDataURL('image/jpeg',.82))}catch(e){reject(e)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Não foi possível ler a imagem.'))};img.src=url})
}

 return withBusy(btn,'Salvando...',async()=>{

   id:newId(),

function editLot(id){let l=DB.lotes.find(x=>x.id===id),p=prod(l.produtoId);$('modal').innerHTML=`<div class="modal" role="presentation"><div class="dialog" role="dialog" aria-modal="true" tabindex="-1" data-original-qty="${Number(l.quantidade||0)}"><h2>Editar lote</h2><p><b>${esc(p.nome)}</b></p><div class="formgrid"><div class="field"><label>Quantidade</label><input id="eq" type="number" min="0" value="${l.quantidade}"></div><div class="field"><label>Validade</label><input id="ev" type="date" value="${l.validade}"></div><div class="field"><label>Aviso (dias antes)</label><input id="ea" type="number" min="0" value="${l.avisoDiasAntes}"></div><div class="field"><label>Lote</label><input id="el" value="${esc(l.lote||'')}"></div></div><div class="row"><button class="warning" onclick="$('eq').value=Math.max(0,+$('eq').value-1)">−1</button><button class="secondary" onclick="$('eq').value=+$('eq').value+1">+1</button><button class="danger" onclick="$('eq').value=0">Zerar</button></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="updateLot('${id}',this)">Salvar alterações</button></div></div></div>`}
async function updateLot(id,btn){
 if(!confirmPastExpiry($('ev').value))return;
 return withBusy(btn,'Salvando...',async()=>{
  const snapshot=cloneDB(DB);
  const original=DB.lotes.find(x=>x.id===id);
  if(!original)return alert('Lote não encontrado.');

  const novaQtd=Math.max(0,Number($('eq').value)||0);
  const dialog=$('eq')?.closest('.dialog');
  const qtdEsperada=Number(dialog?.dataset?.originalQty ?? original.quantidade ?? 0);

  try{
   // Se a quantidade foi editada manualmente, o servidor só aceita se ninguém
   // tiver alterado este mesmo lote desde que o modal foi aberto.
   if(novaQtd!==qtdEsperada){
    const rq=await api('setLotQuantity',{
     loteId:id,
     quantidade:novaQtd,
     quantidadeEsperada:qtdEsperada
    });
    acceptServerDB(rq.data);
   }

   // A partir daqui trabalhamos sobre a versão mais recente devolvida pelo servidor.
   const l=DB.lotes.find(x=>x.id===id);
   if(!l)throw new Error('Lote não encontrado após atualização.');

   l.validade=$('ev').value;
   l.avisoDiasAntes=Math.max(0,Number($('ea').value)||0);
   l.lote=$('el').value.trim();
   l.notificacoes=[];
   rebuildIndexes();

   const ok=await saveDB();
   if(!ok){
    // Não revertemos uma quantidade atômica já confirmada no servidor.
    // Recarregamos a cópia do servidor para evitar mostrar estado incorreto.
    try{
     const fresh=await api('getDatabase');
     acceptServerDB(fresh.data);
    }catch(_){
     DB=snapshot;ensureDB();rebuildIndexes();
    }
    render();
    return;
   }

   closeModal();
  }catch(e){
   if(String(e.message||'').startsWith('CONFLITO_ESTOQUE|')){
    const atual=String(e.message).split('|')[1];
    try{
     const fresh=await api('getDatabase');
     acceptServerDB(fresh.data);
     render();
    }catch(_){}
    alert('A quantidade deste lote foi alterada em outro aparelho e agora é '+atual+'. Abra o lote novamente antes de salvar.');
    closeModal();
    return;
   }
   alert(e.message);
  }
 });
}

async function cameraScan(btn){
 if(!busy(btn,'Abrindo câmera...'))return;
 if(!navigator.mediaDevices?.getUserMedia){free(btn);return alert('A câmera não está disponível neste navegador. Use a versão HTTPS do sistema ou um leitor externo.');}
 if(!('BarcodeDetector' in window)){free(btn);return alert('A leitura automática de código de barras não é suportada neste navegador. Digite o código ou use um leitor Bluetooth/USB.');}
 try{
  const stream=await navigator.mediaDevices.getUserMedia({
   video:{
    facingMode:{ideal:'environment'},
    width:{ideal:1920},
    height:{ideal:1080}
   },
   audio:false
  });
  const track=stream.getVideoTracks()[0];
  const caps=track.getCapabilities?track.getCapabilities():{};
  const settings=track.getSettings?track.getSettings():{};
  window._stream=stream;window._camTrack=track;window._torchOn=false;

  // Tenta foco contínuo quando exposto pelo navegador/aparelho.
  try{
   if(Array.isArray(caps.focusMode)&&caps.focusMode.includes('continuous')){
    await track.applyConstraints({advanced:[{focusMode:'continuous'}]});
   }
  }catch(e){}

  const video=document.createElement('video');
  video.srcObject=stream;video.setAttribute('playsinline','');video.muted=true;
  await video.play();

  $('modal').innerHTML=`<div class="modal cameraModal"><div class="dialog scanDialog">
   <h2>Escanear código</h2>
   <p class="scanHint">Centralize o código dentro da moldura. Para códigos pequenos, aproxime o aparelho ou use o zoom.</p>
   <div class="cameraStage" id="videoBox"><div class="scanFrame"></div></div>
   <div class="cameraControls">
    <button id="torchBtn" class="secondary hide" onclick="toggleTorch(this)">🔦 Ligar lanterna</button>
    <div id="zoomBox" class="zoomControl hide">
     <span>🔍 Zoom</span>
     <input id="zoomRange" type="range" oninput="setCameraZoom(this.value)">
     <span id="zoomValue">1×</span>
    </div>
    <button class="secondary" onclick="stopCam()">Cancelar</button>
   </div>
   <div class="camStatus" id="camStatus"></div>
  </div></div>`;
  $('videoBox').prepend(video);

  // Exibe lanterna somente se suportada.
  if(caps.torch){
   $('torchBtn').classList.remove('hide');
  }

  // Exibe zoom somente se a câmera informar faixa de zoom.
  if(caps.zoom && Number.isFinite(caps.zoom.min) && Number.isFinite(caps.zoom.max) && caps.zoom.max>caps.zoom.min){
   const zr=$('zoomRange');
   zr.min=caps.zoom.min;zr.max=caps.zoom.max;zr.step=caps.zoom.step||0.1;
   zr.value=settings.zoom||caps.zoom.min;
   $('zoomValue').textContent=Number(zr.value).toFixed(1).replace('.0','')+'×';
   $('zoomBox').classList.remove('hide');
  }

  const focusOk=Array.isArray(caps.focusMode)&&caps.focusMode.includes('continuous');
  $('camStatus').textContent=focusOk?'Foco contínuo ativado.':'Foco automático controlado pelo aparelho.';
  free(btn);

  const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});
  let detecting=false;
  window._camTimer=setInterval(async()=>{
   if(detecting||video.readyState<2)return;
   detecting=true;
   try{
    const codes=await det.detect(video);
    if(codes[0]){
     const c=codes[0].rawValue;
     if(navigator.vibrate)navigator.vibrate(80);
     stopCam();go('scanner');
     setTimeout(()=>{$('scanInput').value=c;showCode(c)},50);
    }
   }catch(e){}finally{detecting=false}
  },300);
 }catch(e){
  free(btn);
  const insecure=location.protocol==='file:'||!window.isSecureContext;
  alert(insecure?'A câmera exige que o ValidaFácil seja aberto por HTTPS. O acesso direto pelo arquivo HTML pode bloquear a câmera.':'Não foi possível acessar a câmera: '+e.message);
 }
}

  try{
   const r=await api('login',{email,senha});

   AUTH.token=r.token;
   AUTH.user=r.user;
   localStorage.setItem('validafacil_token',AUTH.token);

   // O backend já devolve o banco público junto com o login.
   // Assim evitamos uma segunda chamada imediata a getDatabase.
   if(!r.data||typeof r.data!=='object'){
    throw new Error('O login foi aceito, mas o servidor não retornou os dados do sistema.');
   }

   acceptServerDB(r.data);
   render();

   $('authScreen').classList.add('hide');
   if(ACTIVE_PAGE==='scanner')setTimeout(()=>$('scanInput')?.focus(),80);
  }catch(e){
   AUTH={token:'',user:null};
   localStorage.removeItem('validafacil_token');
   showAuthLogin();
   alert('Não foi possível entrar/carregar os dados: '+e.message);
  }
 })
}
function forceLogout(){stopAutoSync();AUTH={token:'',user:null};localStorage.removeItem('validafacil_token');showAuthLogin('Sua sessão terminou. Entre novamente.')}
async function logout(btn){
 if(btn&&!busy(btn,'Saindo...'))return;
 
 stopAutoSync();
 const tokenAtual=AUTH.token;
 try{
  if(tokenAtual){
   // Aguarda o servidor, mas não deixa a interface presa indefinidamente.
   await Promise.race([
    api('logout'),
    new Promise(resolve=>setTimeout(resolve,3000))
   ]);
  }
 }catch(e){
  // Mesmo sem resposta do servidor, encerra a sessão local.
 }finally{
  AUTH={token:'',user:null};
  localStorage.removeItem('validafacil_token');
  DB={catalogo:[],catalogoImagens:{},produtos:[],lotes:[],config:{avisoPadraoDias:7}};
  BASE_DB=null;
  showAuthLogin();
 }
}
function showForgot(){$('authContent').innerHTML=`<h3>Redefinir senha</h3><p class="mut">Informe o e-mail cadastrado. Enviaremos um código de verificação válido por 15 minutos.</p><div class="field"><label>E-mail</label><input id="forgotEmail" type="email"></div><button class="primary bigscan" onclick="requestReset(this)">Enviar código</button><div class="authLinks"><button class="linkBtn" onclick="showAuthLogin()">Voltar ao login</button></div>`}
async function requestReset(btn){const email=$('forgotEmail').value.trim();if(!email)return alert('Informe o e-mail.');return withBusy(btn,'Enviando...',async()=>{try{await api('requestPasswordReset',{email});showReset(email)}catch(e){alert(e.message)}})}
function showReset(email){$('authContent').innerHTML=`<h3>Criar nova senha</h3><p class="mut">Digite o código enviado para <b>${esc(email)}</b>.</p><div class="field"><label>Código</label><input id="resetCode" inputmode="numeric" autocomplete="one-time-code"></div><div class="field"><label>Nova senha</label><input id="resetPass" type="password" minlength="6"></div><div class="field"><label>Confirmar nova senha</label><input id="resetPass2" type="password" minlength="6"></div><button class="primary bigscan" onclick="confirmReset('${esc(email)}',this)">Alterar senha</button><div class="authLinks"><button class="linkBtn" onclick="showAuthLogin()">Voltar ao login</button></div>`}
async function confirmReset(email,btn){const codigo=$('resetCode').value.trim(),senha=$('resetPass').value,senha2=$('resetPass2').value;if(senha!==senha2)return alert('As senhas não coincidem.');if(senha.length<6)return alert('A senha deve ter pelo menos 6 caracteres.');return withBusy(btn,'Alterando...',async()=>{try{await api('confirmPasswordReset',{email,codigo,novaSenha:senha});showAuthLogin('Senha alterada com sucesso.')}catch(e){alert(e.message)}})}
async function restoreSession(){
 if(!AUTH.token){
  showAuthLogin();
  return;
 }

 showAuthLogin('Restaurando sessão...');

 try{
  const r=await api('session');
  AUTH.user=r.user;

  if(!r.data||typeof r.data!=='object'){
   // Compatibilidade temporária caso uma implantação antiga ainda esteja ativa.
   await loadApplicationData();
  }else{
   acceptServerDB(r.data);
   render();
  }

  $('authScreen').classList.add('hide');
 }catch(e){
  AUTH={token:'',user:null};
  localStorage.removeItem('validafacil_token');
  showAuthLogin();
 }
}
async function loadUsers(){if(AUTH.user?.perfil!=='admin')return;try{const r=await api('listUsers');const box=$('usersList');if(!box)return;box.innerHTML=r.users.map(u=>`<div class="userItem"><div class="userMeta"><b>${esc(u.nome)}</b><span>${esc(u.email)}</span><span class="roleBadge">${u.perfil==='admin'?'Administrador':'Usuário'}${u.ativo?'':' • Inativo'}</span></div><div class="row">${u.id!==AUTH.user.id?`<button class="${u.ativo?'warning':'secondary'}" onclick="toggleUser('${u.id}',${!u.ativo},this)">${u.ativo?'Inativar':'Reativar'}</button><button class="danger" onclick="deleteUser('${u.id}','${encodeURIComponent(u.nome)}',this)">Excluir</button>`:''}<button class="secondary" onclick="adminReset('${u.id}',this)">Enviar redefinição</button></div></div>`).join('')||'<p class="mut">Nenhum usuário.</p>'}catch(e){if($('usersList'))$('usersList').innerHTML=`<p class="mut">${esc(e.message)}</p>`}}
function openNewUser(){$('modal').innerHTML=`<div class="modal" role="presentation"><div class="dialog" role="dialog" aria-modal="true" tabindex="-1"><h2>Adicionar usuário</h2><div class="field"><label>Nome</label><input id="un"></div><div class="field"><label>E-mail</label><input id="ue" type="email"></div><div class="field"><label>Perfil</label><select id="up"><option value="user">Usuário</option><option value="admin">Administrador</option></select></div><p class="mut">O usuário receberá por e-mail um código para criar a própria senha.</p><div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="createUser(this)">Cadastrar</button></div></div></div>`}
async function createUser(btn){const nome=$('un').value.trim(),email=$('ue').value.trim(),perfil=$('up').value;if(!nome||!email)return alert('Informe nome e e-mail.');return withBusy(btn,'Cadastrando...',async()=>{try{await api('createUser',{nome,email,perfil});closeModal();await loadUsers();toast('Usuário cadastrado e convite enviado.')}catch(e){alert(e.message)}})}
async function toggleUser(id,ativo,btn){return withBusy(btn,ativo?'Reativando...':'Inativando...',async()=>{try{await api('setUserActive',{id,ativo});await loadUsers()}catch(e){alert(e.message)}})}
async function deleteUser(id,nomeEnc,btn){
 const nome=decodeURIComponent(nomeEnc);
 if(!confirm(`Excluir definitivamente o usuário "${nome}"?\n\nEle perderá o acesso imediatamente. Esta ação não pode ser desfeita.`))return;
 return withBusy(btn,'Excluindo...',async()=>{try{await api('deleteUser',{id});await loadUsers();toast('Usuário excluído.')}catch(e){alert(e.message)}})
}
async function adminReset(id,btn){return withBusy(btn,'Enviando...',async()=>{try{await api('adminPasswordReset',{id});toast('Código de redefinição enviado.')}catch(e){alert(e.message)}})}

restoreSession();
</script>
</body>
</html>
